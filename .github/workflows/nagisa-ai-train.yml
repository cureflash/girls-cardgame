name: nagisa-ai-train

on:
  push:
    branches:
      - analysis/nagisa-ai-train
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Train Nagisa dedicated AI
        run: node tools/nagisa-ai-train.mjs
