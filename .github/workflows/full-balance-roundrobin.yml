name: full-balance-roundrobin

on:
  push:
    branches:
      - analysis/full-balance-roundrobin

jobs:
  roundrobin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 100 games per pair
        env:
          GAMES: 100
        run: node tools/full-balance-roundrobin.mjs
