name: homura-rollout

on:
  push:
    branches: ['**']

jobs:
  simulate:
    if: contains(github.event.head_commit.message, '[homura-rollout]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Homura regression tests
        run: node --test tests/homura.test.mjs tests/character-ai.test.mjs
      - name: Run 10 games against each opponent
        env:
          GAMES: 10
        run: node tools/homura-otk-eval.mjs