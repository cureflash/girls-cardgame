name: kyoko-pilot

on:
  push:
    branches: ['**']

jobs:
  pilot:
    if: contains(github.event.head_commit.message, '[kyoko-pilot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kyoko three-matchup pilot
        run: node br/kyoko-pilot.mjs --games 40 --samples 4 --min-gain 0.05 --max-actions 300 --output /tmp/kyoko-pilot.json
      - name: Upload Kyoko pilot
        uses: actions/upload-artifact@v4
        with:
          name: kyoko-pilot
          path: /tmp/kyoko-pilot.json
          retention-days: 7
