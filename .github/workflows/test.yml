name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser app syntax
        run: node --check src/app.js
      - name: Core regression tests
        run: node --test tests/engine.test.mjs tests/hand-tributes.test.mjs tests/rl-adapter.test.mjs tests/evaluation-ai.test.mjs tests/genetics.test.mjs tests/character-ai.test.mjs tests/duel-log.test.mjs tests/cfr.test.mjs tests/best-response.test.mjs
      - name: WebP card assets
        run: node --test --test-name-pattern='all gameplay card art uses non-placeholder WebP assets' tests/integration.test.mjs
      - name: 300-duel regression
        run: node --test --test-name-pattern='300 seeded random and tactical duels finish legally without card loss or deadlock' tests/integration.test.mjs
      - name: Split genetic trainer smoke
        run: |
          npm run ga:evolve -- --population 4 --generations 1 --opponents 1 --max-actions 200 --output /tmp/ga-smoke
          test -f /tmp/ga-smoke/latest-madoka.json
          test -f /tmp/ga-smoke/latest-mami.json
          test -f /tmp/ga-smoke/latest.json
          npm run ga:evaluate -- /tmp/ga-smoke/latest.json --games 8 --seed 99
      - name: Approximate equilibrium solve
        if: contains(github.event.head_commit.message, '[solve-strategy]')
        run: npm run cfr:solve -- --iterations 150 --evaluation-games 200 --rollouts-per-action 1 --max-actions 220 --top 50 --output /tmp/cfr-strategy.json
      - name: Upload strategy report
        if: contains(github.event.head_commit.message, '[solve-strategy]')
        uses: actions/upload-artifact@v4
        with:
          name: cfr-strategy-report
          path: /tmp/cfr-strategy.json
          retention-days: 7
      - name: Rollout best-response analysis
        if: contains(github.event.head_commit.message, '[solve-best-response]')
        run: npm run br:solve -- --character madoka --games 40 --samples 16 --min-gain 0.05 --max-actions 220 --output /tmp/best-response.json
      - name: Upload best-response report
        if: contains(github.event.head_commit.message, '[solve-best-response]')
        uses: actions/upload-artifact@v4
        with:
          name: best-response-report
          path: /tmp/best-response.json
          retention-days: 7
      - name: Paired best-response confirmation
        if: contains(github.event.head_commit.message, '[confirm-best-response]')
        run: node br/confirm.mjs --character madoka --games 100 --samples 16 --min-gain 0.05 --max-actions 220 --output /tmp/best-response-confirmation.json
      - name: Upload best-response confirmation
        if: contains(github.event.head_commit.message, '[confirm-best-response]')
        uses: actions/upload-artifact@v4
        with:
          name: best-response-confirmation
          path: /tmp/best-response-confirmation.json
          retention-days: 7
      - name: Build current-meta bootstrap
        if: contains(github.event.head_commit.message, '[retrain-current-meta]')
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { ACTIVE_GENOMES } from './src/evolved-genome.js';
          fs.writeFileSync('/tmp/current-bootstrap.json', JSON.stringify({
            format: 'girls-cardgame-eval-pair-v1',
            madoka: ACTIVE_GENOMES.madoka,
            mami: ACTIVE_GENOMES.mami,
          }, null, 2));
          NODE
      - name: Retrain current-meta pair
        if: contains(github.event.head_commit.message, '[retrain-current-meta]')
        run: |
          npm run ga:evolve -- --population 20 --generations 100 --opponents 6 --hall-opponents 4 --max-actions 300 --seed 20260914 --bootstrap /tmp/current-bootstrap.json --output /tmp/current-meta-ga
          npm run ga:evaluate -- /tmp/current-meta-ga/latest.json --games 400 --seed 2026091401 --max-actions 300 | tee /tmp/current-meta-evaluation.json
      - name: Upload current-meta pair
        if: contains(github.event.head_commit.message, '[retrain-current-meta]')
        uses: actions/upload-artifact@v4
        with:
          name: current-meta-ga
          path: |
            /tmp/current-meta-ga/latest.json
            /tmp/current-meta-ga/latest-madoka.json
            /tmp/current-meta-ga/latest-mami.json
            /tmp/current-meta-evaluation.json
          retention-days: 7
      - name: Confirm best response versus current-meta champions
        if: contains(github.event.head_commit.message, '[confirm-current-meta-best-response]')
        run: node br/confirm-current-meta.mjs --pair ga/current-meta-analysis-pair.json --character madoka --games 100 --samples 16 --min-gain 0.05 --max-actions 300 --output /tmp/current-meta-best-response.json
      - name: Upload current-meta best response
        if: contains(github.event.head_commit.message, '[confirm-current-meta-best-response]')
        uses: actions/upload-artifact@v4
        with:
          name: current-meta-best-response
          path: /tmp/current-meta-best-response.json
          retention-days: 7
      - name: Reverse best response versus current-meta champions
        if: contains(github.event.head_commit.message, '[confirm-current-meta-mami-best-response]')
        run: node br/confirm-current-meta.mjs --pair ga/current-meta-analysis-pair.json --character mami --games 100 --samples 16 --min-gain 0.05 --max-actions 300 --output /tmp/current-meta-mami-best-response.json
      - name: Upload reverse current-meta best response
        if: contains(github.event.head_commit.message, '[confirm-current-meta-mami-best-response]')
        uses: actions/upload-artifact@v4
        with:
          name: current-meta-mami-best-response
          path: /tmp/current-meta-mami-best-response.json
          retention-days: 7
      - name: Dual rollout equilibrium probe
        if: contains(github.event.head_commit.message, '[dual-rollout]')
        run: node br/dual-current-meta.mjs --pair ga/current-meta-analysis-pair.json --games 100 --samples 16 --min-gain 0.05 --max-actions 300 --output /tmp/dual-current-meta.json
      - name: Upload dual rollout report
        if: contains(github.event.head_commit.message, '[dual-rollout]')
        uses: actions/upload-artifact@v4
        with:
          name: dual-current-meta-report
          path: /tmp/dual-current-meta.json
          retention-days: 7
      - name: Card damage attribution
        if: contains(github.event.head_commit.message, '[witch-damage]')
        run: node br/witch-damage-current-meta.mjs --pair ga/current-meta-analysis-pair.json --games 100 --samples 16 --min-gain 0.05 --max-actions 300 --output /tmp/witch-damage-current-meta.json
      - name: Upload card damage attribution
        if: contains(github.event.head_commit.message, '[witch-damage]')
        uses: actions/upload-artifact@v4
        with:
          name: witch-damage-current-meta
          path: /tmp/witch-damage-current-meta.json
          retention-days: 7
