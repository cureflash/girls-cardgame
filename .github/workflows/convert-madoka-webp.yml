name: convert-madoka-webp

on:
  push:
    branches:
      - feature/madoka-webp

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/madoka-webp
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Convert Madoka PNG cards to WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('assets/cards/madoka')
          files = sorted(root.glob('*.png'))
          if len(files) != 16:
              raise SystemExit(f'expected 16 Madoka PNG source assets, found {len(files)}')

          for src in files:
              dst = src.with_suffix('.webp')
              with Image.open(src) as im:
                  im = im.convert('RGBA')
                  if im.size != (1024, 1536):
                      raise SystemExit(f'{src}: expected 1024x1536, got {im.size}')
                  im = im.resize((512, 768), Image.Resampling.LANCZOS)
                  im.save(dst, 'WEBP', quality=80, method=6)
                  print(f'{src.name} -> {dst.name}')
          PY
      - name: Commit generated WebP files
        run: |
          git add assets/cards/madoka/*.webp
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate Madoka WebP card assets'
          git push origin HEAD:feature/madoka-webp
