name: opening-meta-rollout

on:
  push:
    branches: ['**']

jobs:
  four-character:
    if: contains(github.event.head_commit.message, '[opening-meta]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Opening-hand regression
        run: node --test tests/opening-hand-balance.test.mjs tests/sayaka.test.mjs tests/kyoko.test.mjs
      - name: Four-character rollout
        run: node br/four-character-rollout.mjs --games 100 --samples 4 --min-gain 0.05 --max-actions 300 --output /tmp/opening-meta-four.json
      - name: Upload four-character result
        uses: actions/upload-artifact@v4
        with:
          name: opening-meta-four
          path: /tmp/opening-meta-four.json
          retention-days: 7

  homura-matchups:
    if: contains(github.event.head_commit.message, '[opening-meta]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Opening-hand regression
        run: node --test tests/opening-hand-balance.test.mjs tests/sayaka.test.mjs tests/kyoko.test.mjs
      - name: Homura rollout
        run: node br/homura-rollout.mjs --games 100 --samples 4 --min-gain 0.05 --max-actions 300 --output /tmp/opening-meta-homura.json
      - name: Upload Homura result
        uses: actions/upload-artifact@v4
        with:
          name: opening-meta-homura
          path: /tmp/opening-meta-homura.json
          retention-days: 7
