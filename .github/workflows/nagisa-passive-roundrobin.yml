name: nagisa-passive-roundrobin

on:
  push:
    branches:
      - analysis/nagisa-passive-roundrobin

jobs:
  roundrobin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 100 games per pair
        env:
          GAMES: 100
        run: node tools/nagisa-passive-roundrobin.mjs

# This follow-up commit intentionally triggers the workflow after it exists on the branch.
