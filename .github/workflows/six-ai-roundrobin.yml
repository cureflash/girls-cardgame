name: six-ai-roundrobin

on:
  push:
    branches:
      - analysis/six-ai-roundrobin
  workflow_dispatch:

jobs:
  roundrobin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run six AI round robin
        run: node tools/six-ai-roundrobin.mjs
